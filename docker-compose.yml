# Rotate container logs instead of keeping them forever (~30 MB per service).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  rwtf_nginx:
    logging: *default-logging
    image: nginx:mainline-alpine
    pull_policy: always
    init: true
    restart: unless-stopped
    volumes:
      - webapp-content:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - screenshot-data:/screenshot
      - ./nginx-logs.sh:/nginx-logs.sh:ro
    command: ["/bin/sh", "/nginx-logs.sh"]
    depends_on:
      server:
        restart: true
        required: true
        condition: service_started

  server:
    logging: *default-logging
    build: server
    init: true
    restart: unless-stopped
    depends_on:
      mariadb:
        restart: true
        required: true
        condition: service_started
    environment:
      - TZ=Europe/Berlin
      - TIMESTRAL_URL=http://timestral:8000
    volumes:
      - ./study_files:/tmp/study_files
      - geoip-cache:/app/geoip

  # Timestral forecasting sidecar; only the server talks to it (no ports, not routed by nginx).
  timestral:
    logging: *default-logging
    build: timestral
    init: true
    restart: unless-stopped
    volumes:
      - timestral-cache:/cache

  mariadb:
    logging: *default-logging
    image: mariadb
    pull_policy: always
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=mydatabase
      - MYSQL_USER=myuser
      - MYSQL_PASSWORD=mypassword
      - TZ=Europe/Berlin
    volumes:
      - ./mariadb-data:/var/lib/mysql
  screenshot:
    logging: *default-logging
    build: screenshot
    init: true
    restart: unless-stopped
    depends_on:
      - rwtf_nginx
    environment:
      - TZ=Europe/Berlin
    volumes:
      - screenshot-data:/data

volumes:
  geoip-cache:
  timestral-cache:
  webapp-content:
  screenshot-data:
