# Privacy-preserving access log: client IP shortened to /24 (IPv4) or /48 (IPv6), path without
# query string (search terms, the wifiap token), no X-Forwarded-For. Both logs go to files that
# nginx-logs.sh rotates daily and deletes after 7 days.
map $remote_addr $remote_addr_anon {
    ~(?P<ip>^\d+\.\d+\.\d+)\.         $ip.0;
    ~*(?P<ip>^[0-9a-f]*:[0-9a-f]*:[0-9a-f]*): $ip::;
    default                           -;
}
# Shared cache for the API responses that are the same for every visitor (location below).
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:1m max_size=50m inactive=1d
                 use_temp_path=off;

log_format anon '$remote_addr_anon [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    access_log /var/log/nginx/rwtf/access.log anon;
    error_log /var/log/nginx/rwtf/error.log warn;
    listen 80;
    server_name localhost;

    client_body_in_file_only off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;
    gzip_vary on;
    gzip_min_length 1024;

    location /api {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Append the address we see; Express (trust proxy: private ranges) walks this chain from the
        # right to the first public hop, so rate limits and the Aachen gate key on the real client
        # and a client-supplied X-Forwarded-For can't spoof it.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Predictions and trends don't depend on who asks, so one upstream request serves everyone until
    # the server's Cache-Control max-age runs out (10 min to 24 h). Not /gym (it counts viewers) and
    # not is_aachen, wifi or study (they depend on the client IP). Cached hits skip Express' limiters.
    location ~ ^/api/v1/(gym_interpline|gym/history|gym/monthly|gym/hourly-pattern)$ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache api;
        proxy_cache_valid 200 1m; # only applies when the server sends no Cache-Control
        # Concurrent misses wait for one upstream request instead of each recomputing it; expired
        # entries are served while refreshing in the background, and while the server is down.
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # The first requester's rate-limit counters would otherwise be served to everyone.
        proxy_hide_header RateLimit;
        proxy_hide_header RateLimit-Policy;
        proxy_hide_header RateLimit-Limit;
        proxy_hide_header RateLimit-Remaining;
        proxy_hide_header RateLimit-Reset;
        add_header X-Cache-Status $upstream_cache_status;
    }
    location /embed_picture.png {
        add_header Content-Type image/png;
        alias /screenshot/screenshot.png;
    }

    # File names under /_next/static change with their content, so browsers may keep them.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=604800, immutable"; # 1 week
    }
    location / {
        # Pages keep their URLs across deploys: revalidate (cheap, via ETag) so a deploy shows at once.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html 404.html =404;
    }
}