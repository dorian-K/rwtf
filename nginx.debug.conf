# Privacy-preserving access log: client IP shortened to /24 (IPv4) or /48 (IPv6), path without
# query string (search terms, the wifiap token), no X-Forwarded-For.
map $remote_addr $remote_addr_anon {
    ~(?P<ip>^\d+\.\d+\.\d+)\.         $ip.0;
    ~*(?P<ip>^[0-9a-f]*:[0-9a-f]*:[0-9a-f]*): $ip::;
    default                           -;
}
log_format anon '$remote_addr_anon [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    access_log /var/log/nginx/access.log anon;
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 10s;
    }
    location /embed_picture.png {
        add_header Content-Type image/png;
        alias /screenshot/screenshot.png;
    }

    location / {
        proxy_pass http://host.docker.internal:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
    }
}